name: Deploy to Raspberry Pi

# The image is built & pushed locally with ./push.ps1 — this only makes the Pi pull it and restart.
on:
  workflow_dispatch:
    inputs:
      image:
        description: Docker Hub image, e.g. myuser/ps5-vod-fetcher
        required: true

concurrency:
  group: deploy-pi
  cancel-in-progress: false

jobs:
  deploy:
    # The GitHub runner installed on your Pi (see README → Deploy)
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: deploy/docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: Pull & restart
        env:
          DOCKER_IMAGE: ${{ inputs.image }}
        run: |
          mkdir -p "$HOME/vod-fetcher"
          cp deploy/docker-compose.yml "$HOME/vod-fetcher/"
          cd "$HOME/vod-fetcher"
          docker compose pull
          docker compose up -d
          docker image prune -f
          sleep 5
          [ "$(docker inspect -f '{{.State.Running}}' vod-fetcher)" = "true" ]
